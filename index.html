<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Desks · Run 2</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0e14;--card:#121722;--line:#1f2633;--tx:#e6e9ef;--mu:#8a93a6;--up:#22c55e;--dn:#ef4444;--ac:#60a5fa;--wa:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:8px 0 16px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}.sub{color:var(--mu);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--mu)}
.b-paper{color:var(--wa);border-color:#5a4410}.b-paused{color:var(--mu)}.b-live{color:var(--up);border-color:#14532d}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi .v{font-size:17px;font-weight:600}.kpi .l{font-size:11px;color:var(--mu)}
.eq{font-size:24px;font-weight:700;margin:2px 0 8px}
svg.ch{width:100%;height:90px;display:block;margin-top:10px}
section{margin-top:22px}section>h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:500;font-size:11px;text-transform:uppercase}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}
.empty{padding:14px;color:var(--mu)}
.feed{display:flex;flex-direction:column;gap:6px}.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.it .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.it .r{color:var(--mu);margin-top:2px;font-size:12px;word-break:break-word}
.k-approved{color:var(--up)}.k-killed,.k-vetoed{color:var(--dn)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:860px){.two{grid-template-columns:1fr}.big{font-size:28px}}
footer{margin:28px 0 10px;color:var(--mu);font-size:12px}
</style></head><body><div class="wrap">
<header>
 <div><h1>Paper Desks <span class="badge b-paper">PAPER ONLY</span> <span class="badge" id="runb">Run 2</span></h1>
  <div class="big" id="tot">—</div><div class="sub" id="totsub">loading…</div></div>
 <div class="sub" style="text-align:right"><div id="upd"></div><div id="livest"></div></div>
</header>
<div class="grid" id="desks"></div>
<section><h3>Open positions</h3><div id="open"></div></section>
<div class="two">
 <section><h3>Recent closed trades</h3><div class="tw" id="closed"></div></section>
 <section><h3>Recent decisions</h3><div class="tabs" id="dtabs"></div><div class="feed" id="dec"></div></section>
</div>
<footer id="foot">Simulated paper trading. No real money, no keys, no signing.</footer>
</div>
<script>
const $=s=>document.getElementById(s),START=10000;let D=null,LIVE={},dfilter="all";
const money=n=>n==null||isNaN(n)?"—":(n<0?"-$":"$")+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>n==null||isNaN(n)?"—":(n>0?"+":"")+n.toFixed(2)+"%";
const cls=n=>n>0?"up":n<0?"dn":"mu";
const px=n=>n==null?"—":n>=100?n.toLocaleString(undefined,{maximumFractionDigits:2}):n>=1?n.toFixed(4):Number(n).toPrecision(4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=ts=>{const m=Math.round((Date.now()/1000-ts)/60);return m<1?"just now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
function upnl(o,p){if(p==null)return o.u||0;if(o.inst==="perp"){const q=o.n/o.e,sg=o.side==="short"?-1:1;return sg*q*(p-o.e)-(o.f||0)}return o.qty?o.qty*p-o.z:0}
function chart(pts){if(!pts||pts.length<2)return'<svg class="ch" viewBox="0 0 300 90"><text x="150" y="50" fill="#8a93a6" font-size="11" text-anchor="middle">curve starts after a few cycles</text></svg>';
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]).concat([START]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),W=300,H=90,pd=4;
 const X=x=>pd+(x-x0)/((x1-x0)||1)*(W-2*pd),Y=y=>H-pd-(y-y0)/((y1-y0)||1)*(H-2*pd);
 const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" "),last=pts[pts.length-1][1],c=last>=START?"#22c55e":"#ef4444";
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${Y(START)}" y2="${Y(START)}" stroke="#2a3242" stroke-dasharray="3 3"/><path d="${d} L${X(x1)} ${H} L${X(x0)} ${H} Z" fill="${c}" opacity=".08"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
function render(){if(!D)return;const opens=D.open||[];
 const liveU={};opens.forEach(o=>{const p=LIVE[o.sym||o.mint];o._p=p??o.p;o._u=upnl(o,p??o.p);liveU[o.desk]=(liveU[o.desk]||0)+(o._u-(o.u||0))});
 const act=(D.desks||[]).filter(d=>!d.paused);let tot=0;
 $("desks").innerHTML=(D.desks||[]).map(d=>{const eq=d.paused?START:d.eq+(liveU[d.name]||0);if(!d.paused)tot+=eq;const pl=(eq/START-1)*100;
  const full=((D.full||[]).find(f=>f.desk===d.name)||{}).pts||[];
  return`<div class="card"><h2>${esc(d.name)} ${d.paused?'<span class="badge b-paused">PAUSED</span>':'<span class="badge b-live">RUNNING</span>'}</h2>
  <div class="eq">${money(eq)} <span class="${cls(pl)}" style="font-size:14px">${pct(pl)}</span></div>
  <div class="kpis"><div class="kpi"><div class="v">${d.win==null?"—":d.win+"%"}</div><div class="l">Win rate</div></div>
  <div class="kpi"><div class="v">${d.open}</div><div class="l">Open</div></div><div class="kpi"><div class="v">${d.closed}</div><div class="l">Closed</div></div>
  <div class="kpi"><div class="v ${cls(d.real)}">${money(d.real)}</div><div class="l">Realized</div></div>
  <div class="kpi"><div class="v ${cls(d.unreal+(liveU[d.name]||0))}">${money(d.unreal+(liveU[d.name]||0))}</div><div class="l">Unrealized</div></div>
  <div class="kpi"><div class="v">${d.paused?"—":"#"+(d.cycle??0)}</div><div class="l">Cycle</div></div></div>
  ${d.paused?'<div class="sub" style="margin-top:10px">Paused for run 2. No trades.</div>':chart(full)}</div>`}).join("");
 const base=START*act.length,tp=(tot/base-1)*100;$("tot").innerHTML=`${money(tot)} <span class="${cls(tp)}" style="font-size:16px">${pct(tp)}</span>`;
 $("totsub").textContent=`Total paper equity, ${act.length} running desks ($${(base/1000)}K start) · Run ${D.run?.n||2} started ${D.run?.start||""} WIB`;
 $("upd").textContent="Data updated "+(D.updated||"")+(D.gen_ts?" ("+ago(D.gen_ts)+")":"");
 // open positions
 const by={};opens.forEach(o=>(by[o.desk]=by[o.desk]||[]).push(o));
 $("open").innerHTML=Object.keys(by).length?Object.entries(by).map(([k,os])=>`<div class="sub" style="margin:8px 0 4px">${esc(k)} · ${os.length}</div><div class="tw"><table><tr><th>Asset</th><th>Side</th><th>Entry</th><th>Mark</th><th>Stop</th><th>Size</th><th>P&amp;L</th><th>Score</th><th>Opened</th></tr>`+
  os.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(o=>{const sz=o.inst==="perp"?o.m:o.z,pc=sz?o._u/sz*100:0;return`<tr><td>${o.link?`<a href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.a)}</a>`:esc(o.a)}</td>
  <td>${o.inst==="perp"?`<span class="${o.side==="short"?"dn":"up"}">${o.side.toUpperCase()} ${o.lev}x</span>`:"SPOT"}</td><td>${px(o.e)}</td><td>${px(o._p)}</td><td>${px(o.s)}</td><td>${money(sz)}</td>
  <td class="${cls(o._u)}">${money(o._u)} <span class="sub">${pct(pc)}</span></td><td>${o.sc??"—"}</td><td class="mu">${o.ts?ago(o.ts):esc(o.t)}</td></tr>`}).join("")+`</table></div>`).join(""):'<div class="tw"><div class="empty">No open positions.</div></div>';
 // closed
 const cl=D.closed||[];$("closed").innerHTML=cl.length?`<table><tr><th>Asset</th><th>Desk</th><th>P&amp;L</th><th>Exit</th><th>When</th></tr>`+cl.map(c=>`<tr><td>${c.link?`<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.a)}</a>`:esc(c.a)}</td><td class="mu">${esc(c.desk)}</td><td class="${cls(c.u)}">${money(c.u)} <span class="sub">${pct(c.pc)}</span></td><td class="mu">${esc(String(c.r||"").replace(/_/g," "))}</td><td class="mu">${c.ts?ago(c.ts):esc(c.t)}</td></tr>`).join("")+`</table>`:'<div class="empty">No closed trades yet in run 2.</div>';
 // decisions
 const dec=D.dec||[],F={all:"All",approved:"Approved",vetoed:"Vetoed",killed:"Killed"};
 $("dtabs").innerHTML=Object.entries(F).map(([k,v])=>`<button class="${dfilter===k?"on":""}" onclick="dfilter='${k}';render()">${v} ${k==="all"?dec.length:dec.filter(x=>x.k===k).length}</button>`).join("");
 const ds=dec.filter(x=>dfilter==="all"||x.k===dfilter).slice(0,30);
 $("dec").innerHTML=ds.length?ds.map(x=>`<div class="it"><div class="h"><b class="k-${x.k}">${x.k.toUpperCase()}</b><b>${esc(x.a)}</b>${x.side?`<span class="badge">${esc(x.side)}</span>`:""}${x.sc!=null?`<span class="badge">score ${x.sc}</span>`:""}<span class="sub">${esc(x.desk)} · cycle ${x.cy} · ${ago(x.ts)}</span></div><div class="r">${esc(x.r)}</div></div>`).join(""):'<div class="it mu">No decisions yet.</div>';
 $("foot").innerHTML=`Simulated paper trading. No real money, no keys, no signing. ${esc(D.run?.archive||"Run 1 archived")}.`}
async function load(){try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});D=await r.json();render();live()}catch(e){$("totsub").textContent="Could not load data.json"}}
async function j(u){const c=new AbortController();setTimeout(()=>c.abort(),8000);const r=await fetch(u,{signal:c.signal,cache:"no-store"});if(!r.ok)throw 0;return r.json()}
async function live(){if(!D)return;const os=D.open||[],mints=[...new Set(os.filter(o=>o.mint&&!o.sym).map(o=>o.mint))],syms=[...new Set(os.filter(o=>o.sym).map(o=>o.sym))];let n=0;
 for(let i=0;i<mints.length;i+=30){try{const a=await j("https://api.dexscreener.com/tokens/v1/solana/"+mints.slice(i,i+30).join(","));const best={};(a||[]).forEach(p=>{const m=p.baseToken?.address,l=p.liquidity?.usd||0;if(m&&p.priceUsd&&(!best[m]||l>best[m].l))best[m]={l,p:+p.priceUsd}});for(const m in best){LIVE[m]=best[m].p;n++}}catch(e){}}
 try{const a=await j("https://fapi.binance.com/fapi/v1/premiumIndex");(a||[]).forEach(x=>{if(syms.includes(x.symbol)){LIVE[x.symbol]=+x.markPrice;n++}})}catch(e){}
 $("livest").textContent=n?`Live marks: ${n} prices · ${new Date().toLocaleTimeString()}`:"Live marks unavailable, showing build prices";render()}
load();setInterval(load,120000);setInterval(live,30000);
</script></body></html>
